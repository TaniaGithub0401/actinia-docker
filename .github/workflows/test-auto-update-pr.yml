name: Test alpine dependency PR creation

on:
  workflow_dispatch:

  push:
    branches:
      - test/auto-update-pr

jobs:
  test-auto-update-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Debug git tags
        run: |
          echo "Current commit:"
          git rev-parse HEAD

          echo "Available tags:"
          git tag --list

          echo "Git describe:"
          git describe --tags --long --first-parent || true

          echo "Remotes:"
          git remote -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - id: meta
        name: Set test date
        run: |
          echo "date=2026-09-02" >> "$GITHUB_OUTPUT"

      - name: Test compatibility with actinia-alpine
        uses: docker/build-push-action@v7
        with:
          push: false
          pull: true
          context: .
          file: actinia-alpine/Dockerfile
          target: compatibility-test
          build-args: |
            ALPINE_DEPENDENCIES_TAG=${{ steps.meta.outputs.date }}

      - name: Update alpine dependencies tag
        id: update_tag
        run: |
          sed -i \
            "s/^ARG ALPINE_DEPENDENCIES_TAG=.*/ARG ALPINE_DEPENDENCIES_TAG=${{ steps.meta.outputs.date }}/" \
            actinia-alpine/Dockerfile

          if git diff --quiet actinia-alpine/Dockerfile; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        id: cpr
        if: steps.update_tag.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            actinia-alpine/Dockerfile
          commit-message: "Test automatic alpine dependency update"
          title: "Test automatic alpine dependency update"
          branch: test-auto-update-2026-09-02
          base: main

      - name: Show pull request result
        if: steps.cpr.outputs.pull-request-url
        run: |
          echo "PR URL: ${{ steps.cpr.outputs.pull-request-url }}"
          echo "Operation: ${{ steps.cpr.outputs.pull-request-operation }}"